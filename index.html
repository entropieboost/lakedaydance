<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>FLOAT Challenge | FLOAT Techno am See, Untere Au</title>
    <meta name="description" content="Spiele die FLOAT Jump Challenge bei FLOAT Techno am See in Frastanz (Untere Au)! Die besten 3 gültigen Highscores gewinnen Free Entry & Goodies. Techno, Psy-Techno & am See." />
    <meta name="keywords" content="FLOAT, Daydance, Frastanz, Untere Au, Techno, Open Air, Minigame, Gewinnspiel, Lake Jump, Elektronische Musik" />
    <meta property="og:title" content="FLOAT Challenge | FLOAT Techno am See" />
    <meta property="og:description" content="Spring über Steine und gewinne Tickets für FLOAT Techno am See! Die Top 3 Scores gewinnen Eintritt & Goodies." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/lake-view.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Lenis Smooth Scroll -->
    <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
    <script>
      (function() {
        const lenis = new Lenis({
          duration: 1.2,
          easing: (t) => 1 - Math.pow(1 - t, 3), // easeOutCubic
          smoothWheel: true,
          touchMultiplier: 1.5
        });

        let isLenisPaused = false;
        function raf(time) {
          const isGameActive = document.body.classList.contains('game-active');
          if (isGameActive && !isLenisPaused) {
            lenis.stop();
            isLenisPaused = true;
          } else if (!isGameActive && isLenisPaused) {
            lenis.start();
            isLenisPaused = false;
          }
          lenis.raf(time);
          requestAnimationFrame(raf);
        }

        requestAnimationFrame(raf);
        window.lenis = lenis;
      })();
    </script>
  </body>
</html>
